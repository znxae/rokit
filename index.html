<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rokit Audio Editor</title>
    <link rel="stylesheet" href="./src/themes.css" />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      /* First paint: apply the cached theme before the page shows (main.ts then confirms it with the Go settings file). */
      (function () {
        var t = "auto";
        try { t = localStorage.getItem("rokit.theme") || "auto"; } catch (e) {}
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (["auto", "apple", "dark", "material", "material-dark", "oled"].indexOf(t) < 0) t = "auto";
        document.documentElement.dataset.theme = t === "auto" ? (dark ? "dark" : "apple") : t;
      })();
    </script>
  </head>
  <body>
    <div id="win">
      <aside id="sidebar">
        <div class="side-top"></div>
        <div class="side-h">Alat</div>
        <nav id="nav" aria-label="Alat">
          <button class="side-row sel" id="nav-audio" data-tab="audio" type="button" aria-current="page">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
            <span>Audio</span>
          </button>
        </nav>
        <div class="side-bottom">
          <label for="theme">Tema</label>
          <select class="popup" id="theme">
            <option value="auto">Otomatis (ikuti sistem)</option>
            <option value="apple">Apple Terang</option>
            <option value="dark">Gelap</option>
            <option value="material">Material Terang</option>
            <option value="material-dark">Material Gelap</option>
            <option value="oled">OLED</option>
          </select>
          <div id="side-foot">Memeriksa ffmpeg dan yt-dlp…</div>
        </div>
      </aside>

      <section id="content">
        <div class="titlebar"></div>

        <!-- ================= Audio ================= -->
        <div class="tab active" id="tab-audio">
          <div class="scroll">
            <h1>Audio</h1>
            <div class="banner" id="tools" hidden></div>

            <section>
              <div class="glabel">Input</div>
              <button class="drop" id="pick" type="button">
                <strong><span id="pick-title">Pilih file audio atau video</span></strong>
                <span class="sub" id="pick-sub">MP3, WAV, FLAC, MP4, MKV, …</span>
              </button>
              <form class="group mt" id="url-form">
                <div class="row">
                  <input class="field" id="url" type="url" placeholder="atau tempel URL (YouTube, TikTok, …)" aria-label="URL" autocomplete="off" spellcheck="false" />
                  <button class="btn" id="fetch" type="submit" disabled>Ambil</button>
                </div>
              </form>
              <p class="sub" id="url-err" hidden style="margin:8px 0 0 16px;color:var(--err)">URL harus diawali http:// atau https://</p>
            </section>

            <div class="cols">
              <section>
                <div class="glabel">Format</div>
                <div class="group">
                  <div class="row">
                    <label class="l" for="format">Format</label>
                    <select class="popup" id="format">
                      <option value="mp3">MP3</option><option value="wav">WAV</option><option value="flac">FLAC</option>
                      <option value="ogg">OGG</option><option value="m4a">M4A</option><option value="opus">Opus</option>
                    </select>
                  </div>
                  <div class="row" id="row-bitrate">
                    <label class="l" for="bitrate">Bitrate<small>Nonaktif untuk WAV dan FLAC</small></label>
                    <select class="popup" id="bitrate">
                      <option value="64">64 kbps</option><option value="96">96 kbps</option><option value="128">128 kbps</option>
                      <option value="160">160 kbps</option><option value="192" selected>192 kbps</option>
                      <option value="256">256 kbps</option><option value="320">320 kbps</option>
                    </select>
                  </div>
                  <div class="row">
                    <span class="l">Channel</span>
                    <div class="seg" id="channels" role="radiogroup" aria-label="Channel">
                      <button type="button" class="on" data-v="keep">Asli</button>
                      <button type="button" data-v="mono">Mono</button>
                      <button type="button" data-v="stereo">Stereo</button>
                    </div>
                  </div>
                </div>
              </section>

              <section>
                <div class="glabel">Penyesuaian</div>
                <div class="group">
                  <div class="row stack">
                    <div class="top"><label for="speed">Kecepatan</label><span class="val" id="speed-val">1.00×</span></div>
                    <input type="range" id="speed" min="0.25" max="4" step="0.05" value="1" />
                    <span class="sub" id="speed-hint">Speed normal (1×)</span>
                  </div>
                  <div class="row stack">
                    <div class="top"><label for="gain">Perkeras suara</label><span class="val" id="gain-val">0.0 dB</span></div>
                    <input type="range" id="gain" min="-20" max="20" step="0.5" value="0" />
                  </div>
                </div>
              </section>
            </div>

            <section>
              <div class="glabel">Output</div>
              <div class="group">
                <div class="row">
                  <span class="l">Simpan sebagai</span>
                  <span class="path" id="out-path">—</span>
                  <button class="btn" id="save" type="button" disabled>Ubah…</button>
                </div>
              </div>
            </section>
          </div>

          <footer class="foot">
            <div class="msg">
              <div class="status" id="status" role="status">Pilih file input atau tempel URL.</div>
              <pre class="err" id="error" hidden></pre>
            </div>
            <div class="actions"><button class="btn primary" id="convert" type="button" disabled>Convert</button></div>
          </footer>
        </div>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
